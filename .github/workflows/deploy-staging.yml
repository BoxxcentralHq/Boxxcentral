# New secrets needed, staging-specific (Settings → Secrets and variables → Actions):
#
#   STAGING_FRONTEND_URL          — https://staging.boxxcentral.com
#   STAGING_NEXT_PUBLIC_API_URL   — https://staging-api.boxxcentral.com/api/v1
#   STAGING_MONGODB_URI           — same Mongo instance as prod, different
#                                    db: mongodb://<user>:<pass>@mongo:27017/
#                                    boxxcentral_dev?authSource=admin
#   STAGING_FLW_SECRET_KEY, STAGING_FLW_SECRET_HASH
#                                  — Flutterwave TEST/sandbox keys, never
#                                    live payment keys
#
# Reused as-is from production — same VPS, same Mongo instance, same
# Cloudinary/ZeptoMail accounts, no isolation need there. JWT secrets are
# shared deliberately (staging and production accept each other's tokens —
# accepted tradeoff, not an oversight):
#   SERVER_HOST, SERVER_USER, SERVER_PRIVATE_KEY, GHCR_PAT,
#   JWT_SECRET, JWT_REFRESH_SECRET,
#   ZEPTOMAIL_URL, ZEPTOMAIL_TOKEN, MAIL_FROM, MAIL_FROM_NAME, MAIL_NOREPLY,
#   CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET

name: Deploy Staging

on:
  push:
    branches: [development]

concurrency:
  group: staging-deploy
  cancel-in-progress: false

env:
  BACKEND_IMAGE: ghcr.io/boxxcentralhq/boxxcentral-backend
  FRONTEND_IMAGE: ghcr.io/boxxcentralhq/boxxcentral-frontend

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.STAGING_NEXT_PUBLIC_API_URL }}

  build-and-push:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:staging
            ${{ env.BACKEND_IMAGE }}:staging-${{ github.sha }}
          cache-from: type=gha,scope=backend-staging
          cache-to: type=gha,mode=max,scope=backend-staging

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.STAGING_NEXT_PUBLIC_API_URL }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:staging
            ${{ env.FRONTEND_IMAGE }}:staging-${{ github.sha }}
          cache-from: type=gha,scope=frontend-staging
          cache-to: type=gha,mode=max,scope=frontend-staging

  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # keeps /srv/boxxcentral-staging/docker-compose.staging.yml in sync
      # with the repo — carries no secrets, just image refs and var names
      - name: Sync compose file to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_PRIVATE_KEY }}
          source: docker-compose.staging.yml
          target: /srv/boxxcentral-staging

      - name: Pull images and restart
        uses: appleboy/ssh-action@v1.2.0
        env:
          FRONTEND_URL: ${{ secrets.STAGING_FRONTEND_URL }}
          MONGODB_URI: ${{ secrets.STAGING_MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          FLW_SECRET_KEY: ${{ secrets.STAGING_FLW_SECRET_KEY }}
          FLW_SECRET_HASH: ${{ secrets.STAGING_FLW_SECRET_HASH }}
          ZEPTOMAIL_URL: ${{ secrets.ZEPTOMAIL_URL }}
          ZEPTOMAIL_TOKEN: ${{ secrets.ZEPTOMAIL_TOKEN }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
          MAIL_NOREPLY: ${{ secrets.MAIL_NOREPLY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_PRIVATE_KEY }}
          envs: FRONTEND_URL,MONGODB_URI,JWT_SECRET,JWT_REFRESH_SECRET,FLW_SECRET_KEY,FLW_SECRET_HASH,ZEPTOMAIL_URL,ZEPTOMAIL_TOKEN,MAIL_FROM,MAIL_FROM_NAME,MAIL_NOREPLY,CLOUDINARY_CLOUD_NAME,CLOUDINARY_API_KEY,CLOUDINARY_API_SECRET,GHCR_PAT
          script: |
            echo "$GHCR_PAT" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd /srv/boxxcentral-staging
            docker compose -f docker-compose.staging.yml pull
            docker compose -f docker-compose.staging.yml up -d --remove-orphans
            docker image prune -f
